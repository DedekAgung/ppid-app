name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APKs
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/PPID-BPMPSUMSEL-debug.apk || true
          cp app/build/outputs/apk/release/app-release.apk output/PPID-BPMPSUMSEL-release.apk || true
          ls -lh output/

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PPID-BPMPSUMSEL-apk
          path: output/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PPID BPMPSUMSEL APK build ${{ github.run_number }}
          files: output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
